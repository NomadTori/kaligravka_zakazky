/* ============================================================
   KONSTANTY A POMOCNÉ FUNKCE
   ============================================================ */
const STORAGE_KEY = 'zakazky-prototyp-v2';
const OLD_STORAGE_KEY = 'zakazky-prototyp-v1';

const HOST_THEME = document.documentElement.dataset.theme; // motiv, který nastavil prohlížeč/hostitel

/* Stavy: aktivní = Přijato, Hotovo. Archiv = Odesláno / Odevzdáno (osobní odběr) / Stornováno. */
const FINAL = ['Odesláno', 'Odevzdáno'];
const ACTIVE = ['Přijato', 'Hotovo'];
const isActiveOrder = (o) => ACTIVE.includes(o.status);
const isSent = (o) => FINAL.includes(o.status); // jen tyto zakázky jdou do statistik
const finalFor = (method) => (method === 'pickup' ? 'Odevzdáno' : 'Odesláno');

const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); };
const daysUntil = (s) => Math.round((parseISO(s) - parseISO(todayISO())) / 86400000);
const fmtDate = (s) => (s ? parseISO(s).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' }) : '');
const fmtShort = (s) => parseISO(s).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric' });
const fmtMoney = (n) => new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + ' Kč';
const fmtAxis = (v) => (v >= 1000 ? `${(v / 1000).toLocaleString('cs-CZ', { maximumFractionDigits: 1 })} tis.` : String(Math.round(v)));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const czDays = (n) => (n === 1 ? 'den' : n >= 2 && n <= 4 ? 'dny' : 'dní');
const czCount = (n, a, b, c) => (n === 1 ? a : n >= 2 && n <= 4 ? b : c);
const uid = () => Math.random().toString(36).slice(2, 10);
const parseNum = (v) => { const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return Number.isFinite(n) && n > 0 ? n : 0; };
const parseQty = (v) => Math.max(1, parseInt(v, 10) || 1);
const MONTHS = Array.from({ length: 12 }, (_, i) => cap(new Date(2000, i, 1).toLocaleDateString('cs-CZ', { month: 'long' })));

/* Vyhledávání: bez diakritiky, bez ohledu na velikost písmen, všechna slova musí sedět (napříč poli) */
const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const tokens = (q) => norm(q).split(/\s+/).filter(Boolean);
const haystack = (o) => norm([o.customer_name, o.customer_contact, o.delivery_address, ...o.items.map((i) => i.inscription)].join(' \n '));
const matches = (o, q) => { const t = tokens(q); if (!t.length) return true; const h = haystack(o); return t.every((x) => h.includes(x)); };
const fieldHit = (text, q) => { const t = tokens(q); return t.length > 0 && t.some((x) => norm(text).includes(x)); };

/* Kopírování pro dopravce: jméno, kontakt (telefon), adresa – každé na vlastním řádku */
const carrierText = (o) => [o.customer_name, o.customer_contact, o.delivery_address].filter((x) => x && x.trim()).join('\n');
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* zkusíme záložní postup */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

}
const defaultPrefs = () => ({ viewActive: 'tiles', viewArchive: 'tiles', sortActive: 'deadline', sortArchive: 'newest' });

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.orders) && Array.isArray(p.types)) {
        const orders = p.orders.map((o) => ({ delivery_method: 'shipping', paid: false, ...o }));
        return { theme: 'system', ...p, orders, prefs: { ...defaultPrefs(), ...(p.prefs || {}) } };
      }
    }
  } catch (e) { /* localStorage nemusí být dostupné */ }
  return makeSeed();
}

   FORMULÁŘOVÝ KONCEPT (draft)
   ============================================================ */
const blankItem = (types) => ({ id: uid(), product_type_id: (types.find((t) => t.is_active) || {}).id ?? '', inscription: '', quantity: '1', unit_price: '' });
const newDraftFor = (types) => ({ id: null, created_at: todayISO(), customer_name: '', customer_contact: '', delivery_method: 'shipping', delivery_address: '', deadline: '', status: 'Přijato', paid: false, pricing_mode: 'per_item', price_manual: '', items: [blankItem(types)] });
const draftFromOrder = (o) => ({
  id: o.id, created_at: o.created_at, customer_name: o.customer_name, customer_contact: o.customer_contact,
  delivery_method: o.delivery_method || 'shipping', delivery_address: o.delivery_address, deadline: o.deadline || '', status: o.status, paid: !!o.paid, pricing_mode: o.pricing_mode,
  price_manual: o.pricing_mode === 'total_manual' ? String(o.price_total) : '',
  items: o.items.map((i) => ({ id: i.id, product_type_id: i.product_type_id, inscription: i.inscription, quantity: String(i.quantity), unit_price: i.unit_price ? String(i.unit_price) : '' })),
});
const nextId = (orders, created) => {
  const y = created.slice(0, 4);
  const nums = orders.filter((o) => o.id.startsWith(`#${y}-`)).map((o) => parseInt(o.id.split('-')[1], 10) || 0);
  return `#${y}-${String(Math.max(0, ...nums) + 1).padStart(3, '0')}`;
};

function CopyCarrierButton({ onClick, full }) {

    <button type="button" onClick={onClick} className={`${btnGhost} h-11 px-3 text-sm font-semibold ${full ? 'w-full' : ''}`}>
      <Icon name="copy" size={18} />Kopírovat pro dopravce
    </button>

function Segmented({ options, value, onChange, activeClass, label }) {
  return (
    <div role="group" aria-label={label} className="grid gap-1 rounded-xl bg-stone-100 p-1 dark:bg-stone-800/70" style={{ gridTemplateColumns: `repeat(${options.length}, minmax(0, 1fr))` }}>
      {options.map((o) => {
        const active = o.value === value;
        return (
          <button key={o.value} type="button" aria-pressed={active} onClick={() => onChange(o.value)}
            className={`h-11 rounded-lg px-1 text-sm font-semibold transition ${active ? (activeClass ? activeClass(o.value) : 'bg-white text-stone-900 shadow-sm dark:bg-stone-700 dark:text-white') : 'text-stone-600 dark:text-stone-300'}`}>

/* Rychlé přepínání stavu: Přijato ➔ Hotovo ➔ Odesláno / Odevzdáno (podle způsobu předání) */
function StatusControl({ value, method, onChange }) {
  const fin = finalFor(method);
  const current = FINAL.includes(value) ? fin : value;
  return <Segmented label="Stav zakázky" options={[{ value: 'Přijato', label: 'Přijato' }, { value: 'Hotovo', label: 'Hotovo' }, { value: fin, label: fin }]} value={current} onChange={onChange} activeClass={(v) => STATUS_STYLE[v]} />;
}

function Field({ label, htmlFor, error, children, hint }) {
  return (
    <div className="space-y-1.5">
      <label htmlFor={htmlFor} className="block text-sm font-semibold text-stone-700 dark:text-stone-300">{label}</label>
      {children}
      {hint && !error && <p className="text-xs text-stone-500 dark:text-stone-400">{hint}</p>}
      {error && <p className="text-sm font-medium text-red-600 dark:text-red-400">{error}</p>}
    </div>
  );
}

function Highlight({ text, query }) {
  const toks = tokens(query);
  if (!toks.length || !text) return text || null;
  const n = norm(text);
  if (n.length !== text.length) return text;
  const marks = new Array(text.length).fill(false);
  toks.forEach((t) => { let i = n.indexOf(t); while (i !== -1) { for (let k = i; k < i + t.length; k++) marks[k] = true; i = n.indexOf(t, i + 1); } });
  const out = []; let start = 0;
  for (let i = 1; i <= text.length; i++) {
    if (i === text.length || marks[i] !== marks[start]) {
      const seg = text.slice(start, i);
      out.push(marks[start] ? <mark key={start} className="rounded bg-yellow-200 px-0.5 text-inherit dark:bg-yellow-400/30">{seg}</mark> : <React.Fragment key={start}>{seg}</React.Fragment>);
      start = i;
    }
  }
  return <>{out}</>;
}

/* ============================================================
   ZAKÁZKY A ARCHIV (sdílená obrazovka se seznamem)
   ============================================================ */
function DeadlineChip({ order }) {
  if (!order.deadline) return <span className="text-sm text-stone-400 dark:text-stone-500">Bez termínu</span>;
  if (!isActiveOrder(order)) return <span className="inline-flex items-center gap-1.5 text-sm text-stone-500 dark:text-stone-400"><Icon name="calendar" size={16} />{fmtDate(order.deadline)}</span>;
  const d = daysUntil(order.deadline);
  if (d <= 0) {
    return (
      <span className="inline-flex items-center gap-1.5 rounded-full bg-red-600 px-2.5 py-1 text-sm font-bold text-white dark:bg-red-500 dark:text-red-950">
        <Icon name="alert" size={16} />{d === 0 ? 'Dnes' : `Po termínu ${-d} ${czDays(-d)}`}
      </span>
    );
  }
  if (d <= 3) {
    return (
      <span className="inline-flex items-center gap-1.5 rounded-full bg-orange-100 px-2.5 py-1 text-sm font-bold text-orange-800 dark:bg-orange-950 dark:text-orange-200">
        <Icon name="calendar" size={16} />{d === 1 ? 'Zítra' : `Za ${d} ${czDays(d)}`}
      </span>
    );
  }
  return <span className="inline-flex items-center gap-1.5 text-sm text-stone-600 dark:text-stone-300"><Icon name="calendar" size={16} />do {fmtShort(order.deadline)}</span>;
}

function frameFor(o) {
  const d = isActiveOrder(o) && o.deadline ? daysUntil(o.deadline) : null;
  if (d !== null && d <= 0) return 'border-2 border-red-500 bg-red-50 dark:border-red-500 dark:bg-red-950/40';
  if (d !== null && d <= 3) return 'border-2 border-orange-400 bg-white dark:border-orange-500 dark:bg-stone-900';
  return 'border border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-900';
}

const typeNameOf = (types, id) => (types.find((t) => t.id === id) || {}).name || 'Neznámý typ';

      <button type="button" onClick={() => onOpen(o)} className="-m-1 flex min-h-[44px] w-[calc(100%+0.5rem)] flex-col gap-2 rounded-xl p-1 text-left" aria-label={`Otevřít detail zakázky ${o.id}, ${o.customer_name}`}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <h3 className="font-display text-lg font-bold leading-tight text-stone-900 dark:text-stone-50"><Highlight text={o.customer_name} query={query} /></h3>
            <p className="mt-0.5 text-sm tabular-nums text-stone-500 dark:text-stone-400">{o.id} · přijato {fmtDate(o.created_at)}</p>
          </div>
          <div className="shrink-0"><DeadlineChip order={o} /></div>
        </div>
        {o.customer_contact && (

        )}
        {o.delivery_method === 'pickup' && (
          <p className="flex items-center gap-2 text-sm font-medium text-stone-600 dark:text-stone-300"><Icon name="bag" size={15} className="shrink-0" />Osobní odběr</p>
        )}
        {o.delivery_method !== 'pickup' && fieldHit(o.delivery_address, query) && (
          <p className="flex items-center gap-2 text-sm text-stone-600 dark:text-stone-300"><Icon name="pin" size={15} className="shrink-0" /><span className="min-w-0"><Highlight text={o.delivery_address} query={query} /></span></p>
        )}
        <ul className="space-y-1">
          {o.items.map((i) => (
            <li key={i.id} className="text-[15px] leading-snug text-stone-800 dark:text-stone-200">
              <span className="font-semibold tabular-nums">{i.quantity}× {typeNameOf(types, i.product_type_id)}</span>

/* "Co vyrobit": součet kusů podle typů ze všech neodeslaných (aktivních) zakázek */
function MakeSummary({ orders, types }) {
  const [open, setOpen] = useState(false);
  const [onlyTodo, setOnlyTodo] = useState(false); // jen dosud nevyrobené = bez stavu Hotovo
  const { rows, total, count } = useMemo(() => {
    const src = orders.filter((o) => o.status === 'Přijato' || (!onlyTodo && o.status === 'Hotovo'));
    const m = new Map();
    src.forEach((o) => o.items.forEach((i) => m.set(i.product_type_id, (m.get(i.product_type_id) || 0) + i.quantity)));
    const r = [...m.entries()].map(([id, qty]) => ({ id, qty, name: typeNameOf(types, id) })).sort((a, b) => b.qty - a.qty || a.name.localeCompare(b.name, 'cs'));
    return { rows: r, total: r.reduce((s, x) => s + x.qty, 0), count: src.length };
  }, [orders, types, onlyTodo]);
  return (
    <div className={cardCls}>
      <button type="button" aria-expanded={open} onClick={() => setOpen((v) => !v)} className="flex min-h-[52px] w-full items-center gap-3 rounded-2xl px-4 text-left">
        <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-stone-100 text-stone-700 dark:bg-stone-800 dark:text-stone-200"><Icon name="package" size={20} /></span>
        <span className="flex-1 font-display text-base font-bold">Co vyrobit</span>
        <span className="rounded-full bg-stone-900 px-2.5 py-0.5 text-xs font-bold tabular-nums text-white dark:bg-stone-100 dark:text-stone-900">{total} ks</span>
        <Icon name={open ? 'up' : 'down'} className="text-stone-500 dark:text-stone-400" />
      </button>
      {open && (
        <div className="space-y-3 border-t border-stone-200 px-4 pb-4 pt-3 dark:border-stone-800">
          {rows.length === 0 ? (
            <p className="text-sm text-stone-600 dark:text-stone-400">Nic k výrobě. Všechny aktivní zakázky jsou hotové.</p>
          ) : (
            <>
              <p className="text-[15px] font-semibold leading-snug">K výrobě celkem: {rows.map((r) => `${r.qty}× ${r.name}`).join(', ')}</p>
              <ul className="divide-y divide-stone-100 dark:divide-stone-800">
                {rows.map((r) => (
                  <li key={r.id} className="flex items-center justify-between gap-3 py-2">
                    <span className="text-base">{r.name}</span>
                    <span className="font-display text-xl font-bold tabular-nums">{r.qty} ks</span>
                  </li>
                ))}
              </ul>
              <p className="text-xs text-stone-500 dark:text-stone-400">Celkem {total} ks ze {count} {czCount(count, 'zakázky', 'zakázek', 'zakázek')}.</p>
            </>
          )}
          <button type="button" role="switch" aria-checked={onlyTodo} onClick={() => setOnlyTodo((v) => !v)} className="flex min-h-[44px] w-full items-center justify-between gap-3 rounded-xl text-left">
            <span className="text-sm font-medium text-stone-700 dark:text-stone-300">Jen dosud nevyrobené (bez stavu Hotovo)</span>
            <span className={`flex h-7 w-12 shrink-0 items-center rounded-full p-0.5 transition ${onlyTodo ? 'bg-stone-900 dark:bg-stone-100' : 'bg-stone-300 dark:bg-stone-700'}`}>
              <span className={`h-6 w-6 rounded-full bg-white shadow transition-transform dark:bg-stone-900 ${onlyTodo ? 'translate-x-5' : ''}`} />
            </span>
          </button>
        </div>
      )}
    </div>
  );
}

function ListScreen({ kind, orders, types, query, prefs, setPrefs, onOpen, onStatus, onNew, onJump, statusFilter, setStatusFilter, onCopy, onPaid }) {
  const archive = kind === 'archive';
  const view = archive ? prefs.viewArchive : prefs.viewActive;
  const sort = archive ? prefs.sortArchive : prefs.sortActive;
  const setView = (v) => setPrefs((p) => ({ ...p, [archive ? 'viewArchive' : 'viewActive']: v }));
  const setSort = (v) => setPrefs((p) => ({ ...p, [archive ? 'sortArchive' : 'sortActive']: v }));
  const searching = tokens(query).length > 0;

  const list = useMemo(() => {
    const l = orders.filter((o) => (archive ? !isActiveOrder(o) : isActiveOrder(o) && (statusFilter === 'all' || o.status === statusFilter)) && matches(o, query));
    const byCreated = (a, b) => a.created_at.localeCompare(b.created_at) || a.id.localeCompare(b.id);
    if (sort === 'oldest') l.sort(byCreated);
    else if (sort === 'newest') l.sort((a, b) => byCreated(b, a));
    else l.sort((a, b) => (a.deadline || '9999-12-31').localeCompare(b.deadline || '9999-12-31') || byCreated(b, a));
    return l;
  }, [orders, query, archive, sort, statusFilter]);
  const counts = useMemo(() => {
    const base = orders.filter((o) => isActiveOrder(o) && matches(o, query));
    return { all: base.length, 'Přijato': base.filter((o) => o.status === 'Přijato').length, 'Hotovo': base.filter((o) => o.status === 'Hotovo').length };
  }, [orders, query]);
  const otherCount = useMemo(() => orders.filter((o) => (archive ? isActiveOrder(o) : !isActiveOrder(o)) && matches(o, query)).length, [orders, query, archive]);

  return (
    <div className="space-y-4">
      {!archive && (
        <>
          <div role="group" aria-label="Filtr stavu" className="grid grid-cols-3 gap-1 rounded-xl bg-stone-100 p-1 dark:bg-stone-800/70">
            {[['all', 'Všechny'], ['Přijato', 'Přijato'], ['Hotovo', 'Hotovo']].map(([v, l]) => (
              <button key={v} type="button" aria-pressed={statusFilter === v} onClick={() => setStatusFilter(v)}
                className={`flex h-11 items-center justify-center gap-1.5 rounded-lg px-1 text-sm font-semibold transition ${statusFilter === v ? (v === 'all' ? 'bg-white text-stone-900 shadow-sm dark:bg-stone-700 dark:text-white' : STATUS_STYLE[v]) : 'text-stone-600 dark:text-stone-300'}`}>
                {l}<span className="text-xs font-bold tabular-nums opacity-70">{counts[v]}</span>
              </button>
            ))}
          </div>
          <MakeSummary orders={orders} types={types} />
        </>
      )}
      <div className="flex items-center gap-2">
        <select aria-label="Řazení" className={`${inputCls} flex-1`} value={sort} onChange={(e) => setSort(e.target.value)}>
          {!archive && <option value="deadline">Podle termínu</option>}
          {archive ? <option value="newest">Nejnovější nahoře</option> : <option value="newest">Nejnovější nahoře</option>}
          <option value="oldest">Nejstarší nahoře</option>
        </select>
        <div role="group" aria-label="Zobrazení" className="flex shrink-0 rounded-xl bg-stone-100 p-1 dark:bg-stone-800/70">
          {[['tiles', 'grid', 'Dlaždice'], ['list', 'rows', 'Seznam']].map(([v, ic, lab]) => (
            <button key={v} type="button" aria-label={lab} aria-pressed={view === v} onClick={() => setView(v)}
              className={`flex h-11 w-11 items-center justify-center rounded-lg transition ${view === v ? 'bg-white text-stone-900 shadow-sm dark:bg-stone-700 dark:text-white' : 'text-stone-500 dark:text-stone-400'}`}><Icon name={ic} /></button>
          ))}
        </div>
      </div>

      <p className="text-sm text-stone-600 dark:text-stone-400">
        {searching ? `Hledání „${query.trim()}“ · ` : ''}{list.length} {archive ? czCount(list.length, 'zakázka v archivu', 'zakázky v archivu', 'zakázek v archivu') : czCount(list.length, 'aktivní zakázka', 'aktivní zakázky', 'aktivních zakázek')}
      </p>

      {searching && otherCount > 0 && (
        <div className={`${cardCls} flex items-center justify-between gap-3 p-3`}>
          <p className="text-sm text-stone-700 dark:text-stone-300">{archive ? 'V aktivních' : 'V archivu'} je dalších {otherCount} {czCount(otherCount, 'výsledek', 'výsledky', 'výsledků')}.</p>
          <button type="button" className={`${btnGhost} h-11 shrink-0 px-3 text-sm`} onClick={onJump}>Zobrazit</button>
        </div>
      )}

      {list.length > 0 ? (
        view === 'tiles' ? (
          <div className="grid gap-3 md:grid-cols-2">{list.map((o) => <OrderCard key={o.id} order={o} types={types} query={query} archive={archive} onOpen={onOpen} onStatus={onStatus} onCopy={onCopy} onPaid={onPaid} />)}</div>
        ) : (
          <div className="space-y-2">{list.map((o) => <OrderRow key={o.id} order={o} types={types} query={query} onOpen={onOpen} />)}</div>
        )
      ) : (
        <div className={`${cardCls} flex flex-col items-center gap-3 px-6 py-10 text-center`}>
          <div className="flex h-12 w-12 items-center justify-center rounded-full bg-stone-100 text-stone-500 dark:bg-stone-800 dark:text-stone-400"><Icon name={searching ? 'search' : archive ? 'archive' : 'list'} size={24} /></div>
          <p className="font-display text-lg font-bold">{searching ? 'Nic nenalezeno' : archive ? 'Archiv je prázdný' : statusFilter !== 'all' ? `Žádné zakázky ve stavu ${statusFilter}` : 'Žádné aktivní zakázky'}</p>
          <p className="max-w-xs text-sm text-stone-600 dark:text-stone-400">
            {searching ? 'Zkuste kratší část slova, například jen začátek jména nebo motivu.' : archive ? 'Odeslané, odevzdané a stornované zakázky se ukládají sem.' : statusFilter !== 'all' ? 'V tomto filtru nic není. Přepněte na Všechny.' : 'Nová zakázka se objeví tady, dokud ji neodešlete, neodevzdáte nebo nestornujete.'}
          </p>
          {!searching && !archive && statusFilter === 'all' && <button type="button" className={btnPrimary} onClick={onNew}><Icon name="plus" size={20} />Nová zakázka</button>}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   DETAIL ZAKÁZKY (jen zobrazení, úprava přes tlačítko Upravit)

      <span className="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-stone-100 text-stone-500 dark:bg-stone-800 dark:text-stone-400"><Icon name={icon} size={16} /></span>
      <div className="min-w-0 flex-1">
        <p className="text-xs font-semibold uppercase tracking-wide text-stone-500 dark:text-stone-400">{label}</p>
        <div className="break-words text-base text-stone-900 dark:text-stone-100">{children}</div>
      </div>
    </div>

}

function DetailScreen({ order: o, types, onBack, onEdit, onStatus, onCopy, onPaid }) {
  const [confirmCancel, setConfirmCancel] = useState(false);
  const storno = o.status === 'Stornováno';

function Donut({ slices, selected, onSelect, total, metric }) {
  const R = 15.9155;
  const sel = slices.find((s) => s.id === selected);
  let acc = 0;
  return (
    <svg viewBox="0 0 42 42" className="mx-auto h-60 w-60 max-w-full" role="img" aria-label="Koláčový graf podílu výrobků">
      <g transform="rotate(-90 21 21)">
        <circle cx="21" cy="21" r={R} fill="none" stroke="currentColor" strokeWidth="5" className="text-stone-100 dark:text-stone-800" />
        {slices.map((s) => {
          const dash = slices.length > 1 ? Math.max(s.pct - 0.7, 0.1) : 100;
          const el = (
            <circle key={s.id} cx="21" cy="21" r={R} fill="none" stroke={s.color} strokeWidth={selected === s.id ? 6.6 : 5}
              strokeDasharray={`${dash} ${100 - dash}`} strokeDashoffset={-acc}
              opacity={selected !== null && selected !== s.id ? 0.4 : 1} style={{ cursor: 'pointer', transition: 'opacity .2s, stroke-width .2s' }}
              onClick={() => onSelect(selected === s.id ? null : s.id)} />
          );
          acc += s.pct;
          return el;
        })}
      </g>
      {sel ? (
        <>
          <text x="21" y="17.4" textAnchor="middle" fontSize="2.8" className="fill-stone-500 dark:fill-stone-400">{sel.name.length > 14 ? sel.name.slice(0, 13) + '…' : sel.name}</text>
          <text x="21" y="23.6" textAnchor="middle" fontSize="6" fontWeight="700" className="fill-stone-900 font-display dark:fill-stone-50">{Math.round(sel.pct)} %</text>
          <text x="21" y="27.8" textAnchor="middle" fontSize="2.6" className="fill-stone-500 dark:fill-stone-400">{metric === 'qty' ? `${sel.qty} ks` : fmtMoney(sel.rev)}</text>
        </>
      ) : (
        <>
          <text x="21" y="19" textAnchor="middle" fontSize="2.8" className="fill-stone-500 dark:fill-stone-400">{metric === 'qty' ? 'Celkem kusů' : 'Celkem tržba'}</text>
          <text x="21" y="25" textAnchor="middle" fontSize="4.6" fontWeight="700" className="fill-stone-900 font-display dark:fill-stone-50">{metric === 'qty' ? total : fmtMoney(total)}</text>
        </>
      )}
    </svg>
  );
}

function niceMax(v) {
  if (v <= 0) return 1000;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* Sloupce obratu po měsících (nebo po letech, když je období delší než 24 měsíců) */
function buildBuckets(list, startISO, endISO) {
  const s = parseISO(startISO), e = parseISO(endISO);
  const months = (e.getFullYear() - s.getFullYear()) * 12 + e.getMonth() - s.getMonth() + 1;
  if (months < 2 || months > 1200) return { items: [], yearly: false };
  const yearly = months > 24;
  const map = new Map();
  list.forEach((o) => { const k = yearly ? o.created_at.slice(0, 4) : o.created_at.slice(0, 7); map.set(k, (map.get(k) || 0) + o.price_total); });
  const items = [];
  if (yearly) {
    for (let y = s.getFullYear(); y <= e.getFullYear(); y++) items.push({ key: String(y), label: String(y), title: `Rok ${y}`, value: map.get(String(y)) || 0 });
  } else {
    for (let i = 0; i < months; i++) {
      const d = new Date(s.getFullYear(), s.getMonth() + i, 1);
      const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      items.push({ key: k, label: d.toLocaleDateString('cs-CZ', { month: 'short' }) + (months > 12 ? ` ${String(d.getFullYear()).slice(2)}` : ''), title: cap(d.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' })), value: map.get(k) || 0 });
    }
  }
  return { items, yearly };
}

function BarChart({ data, selected, onSelect }) {
  const n = data.length;
  const max = Math.max(...data.map((d) => d.value), 0);
  const top = niceMax(max);
  const ticks = [0, 1, 2, 3, 4].map((i) => (top * i) / 4);
  const left = 54, right = 8, pt = 16, pb = 28, H = 200;
  const W = Math.max(340, left + right + n * 36);
  const slot = (W - left - right) / n;
  const bw = Math.min(slot * 0.62, 34);
  const ph = H - pt - pb;
  const y = (v) => pt + ph - (v / top) * ph;
  const scroll = W > 340;
  return (
    <div className="-mx-1 overflow-x-auto px-1">
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: scroll ? W : '100%', minWidth: scroll ? W : undefined }} role="img" aria-label="Sloupcový graf obratu">
        {ticks.map((t) => (
          <g key={t}>
            <line x1={left} x2={W - right} y1={y(t)} y2={y(t)} stroke="currentColor" strokeWidth="0.5" className="text-stone-300 dark:text-stone-700" />
            <text x={left - 6} y={y(t) + 3} textAnchor="end" fontSize="9" className="fill-stone-500 dark:fill-stone-400">{fmtAxis(t)}</text>
          </g>
        ))}
        {data.map((d, i) => {
          const x = left + i * slot + (slot - bw) / 2;
          const h = (d.value / top) * ph;
          const dim = selected !== null && selected !== d.key;
          return (
            <g key={d.key} style={{ cursor: 'pointer' }} onClick={() => onSelect(selected === d.key ? null : d.key)}>
              <rect x={left + i * slot} y={pt} width={slot} height={ph} fill="transparent" />
              {d.value > 0 && <rect x={x} y={y(d.value)} width={bw} height={h} rx="3" fill="#2563eb" opacity={dim ? 0.4 : 1} />}
              {n <= 8 && d.value > 0 && <text x={x + bw / 2} y={y(d.value) - 4} textAnchor="middle" fontSize="8" className="fill-stone-700 dark:fill-stone-300">{fmtAxis(d.value)}</text>}
              <text x={left + i * slot + slot / 2} y={H - 10} textAnchor="middle" fontSize="9" fontWeight={selected === d.key ? '700' : '400'} className="fill-stone-600 dark:fill-stone-300">{d.label}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function StatsScreen({ orders, types }) {
  const now = new Date();
  const [mode, setMode] = useState('month');
  const [cur, setCur] = useState({ y: now.getFullYear(), m: now.getMonth() });

  const [to, setTo] = useState(todayISO);
  const [metric, setMetric] = useState('qty');
  const [sel, setSel] = useState(null);
  const [selBar, setSelBar] = useState(null);

  const years = useMemo(() => {
    const ys = orders.map((o) => Number(o.created_at.slice(0, 4)));
    const lo = Math.min(now.getFullYear(), ...ys), hi = Math.max(now.getFullYear(), ...ys);
    const list = [];
    for (let y = hi; y >= lo; y--) list.push(y);
    if (!list.includes(cur.y)) { list.push(cur.y); list.sort((a, b) => b - a); }
    return list;
  }, [orders, cur.y]);

  const step = (dir) => setCur((c) => {
    if (mode === 'year') return { ...c, y: c.y + dir };
    const t = new Date(c.y, c.m + dir, 1);
    return { y: t.getFullYear(), m: t.getMonth() };
  });

  const [rFrom, rTo] = useMemo(() => {
    if (mode === 'month') return [toISO(new Date(cur.y, cur.m, 1)), toISO(new Date(cur.y, cur.m + 1, 0))];
    if (mode === 'year') return [`${cur.y}-01-01`, `${cur.y}-12-31`];
    if (mode === 'custom') return [from, to];
    return ['0000-01-01', '9999-12-31'];
  }, [mode, cur, from, to]);
  const periodLabel = mode === 'month' ? `${MONTHS[cur.m]} ${cur.y}` : mode === 'year' ? `Rok ${cur.y}` : mode === 'custom' ? `${fmtDate(from)} – ${fmtDate(to)}` : 'Všechna data';

  // Do statistik jdou jen odeslané a odevzdané zakázky (archiv bez stornovaných)
  const inPeriod = useMemo(() => orders.filter((o) => isSent(o) && o.created_at >= rFrom && o.created_at <= rTo), [orders, rFrom, rTo]);
  const cancelled = useMemo(() => orders.filter((o) => o.status === 'Stornováno' && o.created_at >= rFrom && o.created_at <= rTo).length, [orders, rFrom, rTo]);
  const revenue = inPeriod.reduce((s, o) => s + o.price_total, 0);
  const count = inPeriod.length;
  const avg = count ? revenue / count : 0;
  const buckets = useMemo(() => {
    let cs = null, ce = null;
    if (mode === 'year') { cs = `${cur.y}-01-01`; ce = `${cur.y}-12-31`; }
    else if (mode === 'custom' && from <= to) { cs = from; ce = to; }
    else if (mode === 'all' && inPeriod.length) { const ds = inPeriod.map((o) => o.created_at).sort(); cs = ds[0]; ce = ds[ds.length - 1]; }
    return cs ? buildBuckets(inPeriod, cs, ce) : { items: [], yearly: false };
  }, [mode, cur.y, from, to, inPeriod]);
  const bar = buckets.items.find((b) => b.key === selBar) || null;

  const { rows, totalQty, totalRev } = useMemo(() => {
    const m = new Map();
    inPeriod.forEach((o) => {
      const q = o.items.reduce((s, i) => s + i.quantity, 0) || 1;
      o.items.forEach((i) => {
        const rev = o.pricing_mode === 'per_item' ? i.quantity * i.unit_price : (o.price_total * i.quantity) / q; // paušál se dělí podle počtu kusů
        const c = m.get(i.product_type_id) || { qty: 0, rev: 0 };
        c.qty += i.quantity; c.rev += rev; m.set(i.product_type_id, c);
      });
    });
    const arr = [...m.entries()].map(([id, v]) => ({ id, name: typeNameOf(types, id), ...v }));
    arr.sort((a, b) => (metric === 'qty' ? b.qty - a.qty : b.rev - a.rev) || a.name.localeCompare(b.name, 'cs'));
    const tq = arr.reduce((s, r) => s + r.qty, 0); const tr = arr.reduce((s, r) => s + r.rev, 0);
    arr.forEach((r, i) => { r.color = CHART_COLORS[i % CHART_COLORS.length]; r.pct = metric === 'qty' ? (tq ? (r.qty / tq) * 100 : 0) : (tr ? (r.rev / tr) * 100 : 0); r.revShare = tr ? (r.rev / tr) * 100 : 0; });
    return { rows: arr, totalQty: tq, totalRev: tr };
  }, [inPeriod, types, metric]);

  const selected = rows.some((r) => r.id === sel) ? sel : null;
  const stepBtn = 'flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-stone-300 bg-white text-stone-800 transition active:scale-95 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100';
  const kpi = (label, value, wide) => (
    <div className={`${cardCls} p-4 ${wide ? 'col-span-2' : ''}`}>
      <p className="text-sm font-semibold text-stone-500 dark:text-stone-400">{label}</p>
      <p className={`mt-1 font-display font-bold tabular-nums ${wide ? 'text-4xl' : 'text-2xl'}`}>{value}</p>
    </div>
  );

  return (
    <div className="mx-auto max-w-xl space-y-5">
      <section className={`${cardCls} space-y-3 p-4`}>
        <span className="block text-sm font-semibold text-stone-700 dark:text-stone-300">Období</span>
        <Segmented label="Typ období" value={mode} onChange={(v) => { setMode(v); setSelBar(null); }} options={[{ value: 'month', label: 'Měsíc' }, { value: 'year', label: 'Rok' }, { value: 'custom', label: 'Vlastní' }, { value: 'all', label: 'Vše' }]} />
        {(mode === 'month' || mode === 'year') && (
          <div className="flex items-center gap-2">
            <button type="button" aria-label={mode === 'month' ? 'Předchozí měsíc' : 'Předchozí rok'} className={stepBtn} onClick={() => step(-1)}><Icon name="back" /></button>
            {mode === 'month' && (
              <select aria-label="Měsíc" className={inputCls} value={cur.m} onChange={(e) => setCur((c) => ({ ...c, m: Number(e.target.value) }))}>
                {MONTHS.map((n, i) => <option key={n} value={i}>{n}</option>)}
              </select>
            )}
            <select aria-label="Rok" className={inputCls} value={cur.y} onChange={(e) => setCur((c) => ({ ...c, y: Number(e.target.value) }))}>
              {years.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
            <button type="button" aria-label={mode === 'month' ? 'Další měsíc' : 'Další rok'} className={stepBtn} onClick={() => step(1)}><Icon name="next" /></button>
          </div>
        )}
        {mode === 'custom' && (
          <div className="grid grid-cols-2 gap-3">
            <Field label="Od" htmlFor="s-from"><input id="s-from" type="date" className={inputCls} value={from} onChange={(e) => { setFrom(e.target.value); setSelBar(null); }} /></Field>
            <Field label="Do" htmlFor="s-to"><input id="s-to" type="date" className={inputCls} value={to} onChange={(e) => { setTo(e.target.value); setSelBar(null); }} /></Field>
          </div>
        )}
        <p className="text-sm tabular-nums text-stone-600 dark:text-stone-400">{periodLabel}{mode === 'custom' && from > to ? ' · datum „od“ je po datu „do“' : ''}</p>
      </section>

      <div className="grid grid-cols-2 gap-3">
        {kpi('Celkový obrat', fmtMoney(revenue), true)}
        {kpi('Vyřízené zakázky', count)}
        {kpi('Průměr na zakázku', fmtMoney(avg))}
      </div>
      <p className="-mt-2 text-xs text-stone-500 dark:text-stone-400">
        Počítají se jen odeslané a odevzdané zakázky z archivu, podle data vytvoření.{cancelled > 0 ? ` Stornováno v období: ${cancelled} (nezapočítáno).` : ' Stornované se nezapočítávají.'}
      </p>

      {buckets.items.length > 0 && (
        <section className={`${cardCls} space-y-3 p-4`}>
          <h2 className="font-display text-lg font-bold">{buckets.yearly ? 'Obrat po letech' : 'Obrat po měsících'}</h2>
          <p className="min-h-[20px] text-sm tabular-nums text-stone-600 dark:text-stone-400">
            {bar ? <><span className="font-semibold text-stone-900 dark:text-stone-100">{bar.title}</span> · {fmtMoney(bar.value)}</> : 'Klepněte na sloupec pro přesnou částku.'}
          </p>
          <BarChart data={buckets.items} selected={selBar} onSelect={setSelBar} />
        </section>
      )}

      <section className={`${cardCls} space-y-4 p-4`}>
        <h2 className="font-display text-lg font-bold">Podíl výrobků</h2>
        {rows.length === 0 ? (
          <p className="py-6 text-center text-sm text-stone-600 dark:text-stone-400">V tomto období nejsou žádné odeslané ani odevzdané zakázky. Zvolte jiné období.</p>
        ) : (
          <>
            <Segmented label="Zobrazit podle" value={metric} onChange={setMetric} options={[{ value: 'qty', label: 'Podle kusů' }, { value: 'rev', label: 'Podle tržby' }]} />
            <Donut slices={rows} selected={selected} onSelect={setSel} total={metric === 'qty' ? totalQty : totalRev} metric={metric} />
            <div className="-mx-1 overflow-x-auto">
              <table className="w-full min-w-[320px] text-left text-sm">
                <thead>
                  <tr className="text-xs uppercase tracking-wide text-stone-500 dark:text-stone-400">
                    <th className="px-1 pb-2 font-semibold">Typ</th><th className="px-1 pb-2 text-right font-semibold">Kusů</th><th className="px-1 pb-2 text-right font-semibold">Tržba</th><th className="px-1 pb-2 text-right font-semibold">Podíl</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.id} tabIndex={0} onClick={() => setSel(selected === r.id ? null : r.id)} onKeyDown={(e) => { if (e.key === 'Enter') setSel(selected === r.id ? null : r.id); }}
                      className={`cursor-pointer border-t border-stone-200 dark:border-stone-800 ${selected === r.id ? 'bg-stone-100 dark:bg-stone-800/70' : ''}`}>
                      <td className="flex min-h-[44px] items-center gap-2 px-1 font-semibold"><span className="h-3 w-3 shrink-0 rounded-full" style={{ background: r.color }} />{r.name}</td>
                      <td className="px-1 text-right tabular-nums">{r.qty}</td>
                      <td className="px-1 text-right tabular-nums">{fmtMoney(r.rev)}</td>
                      <td className="px-1 text-right font-semibold tabular-nums">{Math.round(r.revShare)} %</td>
                    </tr>
                  ))}
                  <tr className="border-t-2 border-stone-300 font-bold dark:border-stone-700">
                    <td className="px-1 py-3">Celkem</td><td className="px-1 text-right tabular-nums">{totalQty}</td><td className="px-1 text-right tabular-nums">{fmtMoney(totalRev)}</td><td className="px-1 text-right tabular-nums">100 %</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p className="text-xs text-stone-500 dark:text-stone-400">U paušálních zakázek se cena rozdělí mezi typy podle počtu kusů. Podíl v tabulce je podíl na obratu.</p>
          </>
        )}
      </section>
    </div>
  );
}

/* ============================================================
   NASTAVENÍ
   ============================================================ */
function SettingsScreen({ types, setTypes, orders, theme, setTheme, onReset }) {
  const [newName, setNewName] = useState('');
  const [confirmReset, setConfirmReset] = useState(false);
  const usage = (id) => orders.filter((o) => o.items.some((i) => i.product_type_id === id)).length;
  const rename = (id, name) => setTypes((ts) => ts.map((t) => (t.id === id ? { ...t, name } : t)));
  const toggle = (id) => setTypes((ts) => ts.map((t) => (t.id === id ? { ...t, is_active: !t.is_active } : t)));
  const add = (e) => {
    e.preventDefault();
    const name = newName.trim();
    if (!name) return;
    setTypes((ts) => [...ts, { id: Math.max(0, ...ts.map((t) => t.id)) + 1, name, is_active: true }]);
    setNewName('');
  };

  return (
    <div className="mx-auto max-w-xl space-y-5">
      <section className={`${cardCls} space-y-3 p-4`}>
        <h2 className="font-display text-lg font-bold">Vzhled při spuštění</h2>
        <Segmented label="Motiv" value={theme} onChange={setTheme} options={[{ value: 'system', label: 'Podle systému' }, { value: 'light', label: 'Světlý' }, { value: 'dark', label: 'Tmavý' }]} />
        <p className="text-sm text-stone-500 dark:text-stone-400">Volba se pamatuje. Přepínač slunce/měsíc v hlavičce ji změní také.</p>
      </section>

      <section className={`${cardCls} space-y-3 p-4`}>
        <div>
          <h2 className="font-display text-lg font-bold">Typy výrobků</h2>
          <p className="text-sm text-stone-500 dark:text-stone-400">Skrytý typ zmizí z nabídky ve formuláři, ale zůstane u starých zakázek.</p>
        </div>
        <ul className="space-y-2">
          {types.map((t) => {
            const n = usage(t.id);
            return (
              <li key={t.id} className="flex items-center gap-2">
                <div className="min-w-0 flex-1">
                  <input aria-label={`Název typu ${t.name}`} className={`${inputCls} ${t.is_active ? '' : 'text-stone-400 dark:text-stone-500'}`} value={t.name} onChange={(e) => rename(t.id, e.target.value)} onBlur={() => { if (!t.name.trim()) rename(t.id, 'Nový typ'); }} />
                  <p className="mt-0.5 px-1 text-xs text-stone-500 dark:text-stone-400">{n === 0 ? 'zatím nepoužito' : `použito v ${n} ${czCount(n, 'zakázce', 'zakázkách', 'zakázkách')}`}{t.is_active ? '' : ' · skrytý'}</p>
                </div>
                <button type="button" role="switch" aria-checked={t.is_active} aria-label={t.is_active ? `Skrýt typ ${t.name}` : `Zobrazit typ ${t.name}`} onClick={() => toggle(t.id)}
                  className={`mb-4 flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border transition active:scale-95 ${t.is_active ? 'border-stone-300 bg-white text-stone-800 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100' : 'border-stone-200 bg-stone-100 text-stone-400 dark:border-stone-800 dark:bg-stone-800 dark:text-stone-500'}`}>
                  <Icon name={t.is_active ? 'eye' : 'eyeoff'} />
                </button>
              </li>
            );
          })}
        </ul>
        <form onSubmit={add} className="flex gap-2 pt-1">
          <input aria-label="Název nového typu" className={inputCls} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Nový typ, např. Karafy" autoComplete="off" />
          <button type="submit" className={`${btnPrimary} shrink-0 px-4`}><Icon name="plus" size={20} />Přidat</button>
        </form>
      </section>

      <section className={`${cardCls} space-y-3 p-4`}>
        <h2 className="font-display text-lg font-bold">Data prototypu</h2>
        <p className="text-sm text-stone-500 dark:text-stone-400">Zakázky a typy se ukládají jen v tomto prohlížeči. Obnovení vrátí ukázkové zakázky a typy.</p>
        {!confirmReset ? (
          <button type="button" className={`${btnGhost} w-full`} onClick={() => setConfirmReset(true)}><Icon name="reset" size={18} />Obnovit ukázková data</button>
        ) : (
          <div className="space-y-2 rounded-xl border border-red-300 bg-red-50 p-3 dark:border-red-800 dark:bg-red-950/40">
            <p className="text-sm font-semibold text-red-800 dark:text-red-200">Všechny vaše zakázky se nahradí ukázkovými.</p>
            <div className="grid grid-cols-2 gap-2">
              <button type="button" className="h-12 rounded-xl bg-red-600 text-base font-semibold text-white dark:bg-red-500 dark:text-red-950" onClick={() => { onReset(); setConfirmReset(false); }}>Ano, obnovit</button>
              <button type="button" className={btnGhost} onClick={() => setConfirmReset(false)}>Ne</button>
            </div>
          </div>
        )}
      </section>
    </div>
  );
}

/* ============================================================
   APLIKACE
   ============================================================ */
function App() {
  const [init] = useState(loadState);
  const [orders, setOrders] = useState(init.orders);
  const [types, setTypes] = useState(init.types);
  const [theme, setTheme] = useState(init.theme);
  const [prefs, setPrefs] = useState(init.prefs);
  const [screen, setScreen] = useState('orders'); // orders | archive | detail | form | stats | settings
  const [query, setQuery] = useState('');
  const [newDraft, setNewDraft] = useState(null);   // rozepsaná nová zakázka (zůstává při přepínání)
  const [editDraft, setEditDraft] = useState(null); // úprava existující zakázky
  const [detailId, setDetailId] = useState(null);
  const [detailFrom, setDetailFrom] = useState('orders');
  const [toast, setToast] = useState(null);
  const [statusFilter, setStatusFilter] = useState('all'); // rychlý filtr v aktivních zakázkách
  const [sysDark, setSysDark] = useState(() => window.matchMedia('(prefers-color-scheme: dark)').matches);

  // Perzistence do localStorage
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ orders, types, theme, prefs })); } catch (e) { /* ignoruj */ }
  }, [orders, types, theme, prefs]);

  // Tmavý režim
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = (e) => setSysDark(e.matches);
    mq.addEventListener('change', h);
    return () => mq.removeEventListener('change', h);
  }, []);
  const isDark = theme === 'dark' || (theme === 'system' && (HOST_THEME ? HOST_THEME === 'dark' : sysDark));
  useLayoutEffect(() => {
    const root = document.documentElement;
    root.classList.toggle('dark', isDark);
    if (theme === 'system') { if (HOST_THEME) root.dataset.theme = HOST_THEME; else delete root.dataset.theme; }
    else root.dataset.theme = theme;
  }, [theme, isDark]);

  // Toast s automatickým zavřením
  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => setToast(null), 5000);
    return () => clearTimeout(t);
  }, [toast]);
  const showToast = (msg, undo) => setToast({ msg, undo, key: Date.now() });

  const setStatus = (id, status) => {
    const o = orders.find((x) => x.id === id);
    if (!o || o.status === status) return;
    const prev = o.status;
    const msg = status === 'Stornováno' ? `${id} stornována, je v archivu`
      : FINAL.includes(status) ? `${id} ${status.toLowerCase()} a přesunuto do archivu`
      : !isActiveOrder(o) ? `${id} je zpět mezi aktivními (${status})` : `${id}: ${status}`;
    setOrders((os) => os.map((x) => (x.id === id ? { ...x, status } : x)));
    showToast(msg, () => setOrders((os) => os.map((x) => (x.id === id ? { ...x, status: prev } : x))));
  };

  const setPaid = (id, paid) => {
    const o = orders.find((x) => x.id === id);
    if (!o || !!o.paid === paid) return;
    setOrders((os) => os.map((x) => (x.id === id ? { ...x, paid } : x)));
    showToast(paid ? `${id} označena jako zaplacená` : `${id} označena jako nezaplacená`, () => setOrders((os) => os.map((x) => (x.id === id ? { ...x, paid: !paid } : x))));
  };
  const copyForCarrier = async (o) => {
    const ok = await copyText(carrierText(o));
    showToast(ok ? 'Zkopírováno' : 'Kopírování se nepovedlo');
  };

  // Navigace
  const go = (s) => { setEditDraft(null); setScreen(s); };
  const goNew = () => { setEditDraft(null); setNewDraft((d) => d || newDraftFor(types)); setScreen('form'); };
  const openDetail = (o) => { setDetailId(o.id); setDetailFrom(screen === 'archive' ? 'archive' : 'orders'); setScreen('detail'); };
  const startEdit = (o) => { setEditDraft(draftFromOrder(o)); setScreen('form'); };
  const onSearch = (v) => { setQuery(v); if (v.trim() && screen !== 'orders' && screen !== 'archive') go('orders'); };

  const formDraft = editDraft || newDraft;
  const setFormDraft = editDraft ? setEditDraft : setNewDraft;

  const saveForm = () => {
    const d = formDraft;
    const id = d.id || nextId(orders, d.created_at);
    const pickup = d.delivery_method === 'pickup';
    const items = d.items.map((i) => ({ id: i.id, order_id: id, product_type_id: Number(i.product_type_id), inscription: i.inscription.trim(), quantity: parseQty(i.quantity), unit_price: parseNum(i.unit_price) }));
    const price_total = d.pricing_mode === 'per_item' ? items.reduce((s, i) => s + i.quantity * i.unit_price, 0) : parseNum(d.price_manual);
    const status = FINAL.includes(d.status) ? finalFor(d.delivery_method) : d.status;
    const order = { id, created_at: d.created_at, customer_name: d.customer_name.trim(), customer_contact: d.customer_contact.trim(), delivery_method: d.delivery_method, delivery_address: pickup ? '' : d.delivery_address.trim(), deadline: d.deadline, status, pricing_mode: d.pricing_mode, price_total, paid: !!d.paid, items };
    setOrders((os) => (d.id ? os.map((o) => (o.id === id ? order : o)) : [order, ...os]));
    if (d.id) {
      setEditDraft(null); setDetailId(id); setScreen('detail'); showToast(`${id} uložena`);
    } else {
      setNewDraft(null); setScreen(isActiveOrder(order) ? 'orders' : 'archive'); showToast(`Zakázka ${id} vytvořena`);
    }
  };
  const cancelForm = () => {
    if (editDraft) { setEditDraft(null); setScreen('detail'); } else { setNewDraft(null); setScreen('orders'); }
  };
  const deleteOrder = () => {
    const id = editDraft.id;
    setOrders((os) => os.filter((o) => o.id !== id));
    setEditDraft(null); setScreen(detailFrom); showToast(`Zakázka ${id} smazána`);
  };
  const resetData = () => { const s = makeSeed(); setOrders(s.orders); setTypes(s.types); setPrefs(s.prefs); setNewDraft(null); setEditDraft(null); showToast('Ukázková data obnovena'); };

  const detailOrder = orders.find((o) => o.id === detailId);
  // Badge u "Zakázky": aktivní zakázky s termínem do 3 dnů nebo po termínu
  const urgent = orders.filter((o) => isActiveOrder(o) && o.deadline && daysUntil(o.deadline) <= 3).length;
  const titles = { orders: 'Zakázky', archive: 'Archiv', detail: 'Detail zakázky', form: editDraft ? `Úprava ${editDraft.id}` : 'Nová zakázka', stats: 'Statistiky', settings: 'Nastavení' };
  const activeNav = screen === 'detail' ? detailFrom : screen === 'form' ? (editDraft ? detailFrom : 'form') : screen;
  const NAV = [
    { id: 'orders', label: 'Zakázky', full: 'Zakázky', icon: 'list', go: () => go('orders') },
    { id: 'form', label: 'Nová', full: 'Nová zakázka', icon: 'plus', go: goNew },
    { id: 'stats', label: 'Statistiky', full: 'Statistiky', icon: 'chart', go: () => go('stats') },
    { id: 'archive', label: 'Archiv', full: 'Archiv', icon: 'archive', go: () => go('archive') },
    { id: 'settings', label: 'Nastavení', full: 'Nastavení', icon: 'sliders', go: () => go('settings') },
  ];

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100">
      <header className="sticky z-30 border-b border-stone-200 bg-stone-50/95 backdrop-blur dark:border-stone-800 dark:bg-stone-950/95" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className="mx-auto max-w-3xl space-y-3 px-4 pb-3 pt-3">
          <div className="flex items-center justify-between gap-3">
            <h1 className="min-w-0 truncate font-display text-2xl font-bold leading-none tracking-tight">{titles[screen]}</h1>
            <button type="button" onClick={() => setTheme(isDark ? 'light' : 'dark')} aria-label={isDark ? 'Přepnout na světlý režim' : 'Přepnout na tmavý režim'}
              className="-mr-1 flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-stone-300 bg-white text-stone-800 transition active:scale-95 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
              <Icon name={isDark ? 'sun' : 'moon'} />
            </button>
          </div>
          <div className="relative" role="search">
            <Icon name="search" size={20} className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 dark:text-stone-500" />
            <input id="global-search" aria-label="Hledat v zakázkách" className={`${inputCls} pl-11 pr-12`} value={query} onChange={(e) => onSearch(e.target.value)} placeholder="Hledat jméno, kontakt, adresu, motiv…" enterKeyHint="search" autoComplete="off" />
            {query && <button type="button" aria-label="Vymazat hledání" onClick={() => setQuery('')} className="absolute right-0.5 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center text-stone-500 dark:text-stone-400"><Icon name="x" /></button>}
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-3xl px-4 pb-36 pt-4">
        {screen === 'orders' && <ListScreen kind="active" orders={orders} types={types} query={query} prefs={prefs} setPrefs={setPrefs} onOpen={openDetail} onStatus={setStatus} onNew={goNew} onJump={() => go('archive')} statusFilter={statusFilter} setStatusFilter={setStatusFilter} onCopy={copyForCarrier} onPaid={setPaid} />}
        {screen === 'archive' && <ListScreen kind="archive" orders={orders} types={types} query={query} prefs={prefs} setPrefs={setPrefs} onOpen={openDetail} onStatus={setStatus} onNew={goNew} onJump={() => go('orders')} statusFilter={statusFilter} setStatusFilter={setStatusFilter} onCopy={copyForCarrier} onPaid={setPaid} />}
        {screen === 'detail' && detailOrder && <DetailScreen key={detailOrder.id} order={detailOrder} types={types} onBack={() => go(detailFrom)} onEdit={startEdit} onStatus={setStatus} onCopy={copyForCarrier} onPaid={setPaid} />}
        {screen === 'detail' && !detailOrder && <p className="py-10 text-center text-stone-600 dark:text-stone-400">Zakázka už neexistuje.</p>}
        {screen === 'form' && formDraft && <FormScreen key={editDraft ? editDraft.id : 'new'} draft={formDraft} setDraft={setFormDraft} types={types} onSave={saveForm} onCancel={cancelForm} onDelete={deleteOrder} />}
        {screen === 'stats' && <StatsScreen orders={orders} types={types} />}
        {screen === 'settings' && <SettingsScreen types={types} setTypes={setTypes} orders={orders} theme={theme} setTheme={setTheme} onReset={resetData} />}
      </main>

      {toast && (
        <div className="pointer-events-none fixed inset-x-0 z-50 flex justify-center px-4" style={{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 80px)' }}>
          <div role="status" aria-live="polite" className="pointer-events-auto flex max-w-md items-center gap-2 rounded-xl bg-stone-900 py-1 pl-4 pr-1 text-sm font-medium text-white shadow-lg dark:bg-stone-100 dark:text-stone-900">
            <span className="py-2">{toast.msg}</span>
            {toast.undo && <button type="button" className="h-11 shrink-0 rounded-lg px-3 font-bold underline" onClick={() => { toast.undo(); setToast(null); }}>Vrátit</button>}
          </div>
        </div>
      )}

      <nav aria-label="Hlavní navigace" className="fixed inset-x-0 bottom-0 z-40 border-t border-stone-200 bg-white/95 backdrop-blur dark:border-stone-800 dark:bg-stone-900/95" style={{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        <div className="mx-auto flex max-w-3xl">
          {NAV.map((n) => {
            const active = activeNav === n.id;
            return (
              <button key={n.id} type="button" onClick={n.go} aria-label={n.id === 'orders' && urgent > 0 ? `${n.full}, ${urgent} k vyřízení` : n.full} aria-current={active ? 'page' : undefined}
                className={`relative flex h-16 min-w-0 flex-1 flex-col items-center justify-center gap-1 px-0.5 text-[11px] font-semibold transition ${active ? 'text-stone-900 dark:text-white' : 'text-stone-500 dark:text-stone-400'}`}>
                {active && <span className="absolute inset-x-4 top-0 h-0.5 rounded-full bg-stone-900 dark:bg-white" />}
                <span className="relative">
                  <Icon name={n.icon} size={22} />
                  {n.id === 'orders' && urgent > 0 && (
                    <span className="absolute -right-3 -top-2 flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-bold leading-none text-white ring-2 ring-white dark:bg-red-500 dark:ring-stone-900">{urgent > 9 ? '9+' : urgent}</span>
                  )}
                </span>
                <span className="max-w-full truncate">{n.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
